<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YvesFX | Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: #ffffff;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #20d6a3;
    margin-bottom: 22px;
}

.card {
    background: #0d1c2d;
    border: 1px solid #1c3045;
    border-radius: 15px;
    padding: 30px 22px;
}

h1 {
    text-align: center;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    color: #9eacbb;
    margin-bottom: 25px;
    font-size: 14px;
}

label {
    display: block;
    margin: 18px 0 7px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;

    border-radius: 8px;
    border: 1px solid #294057;

    background: #07111f;
    color: #ffffff;

    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #20d6a3;
}

button {
    width: 100%;

    margin-top: 22px;
    padding: 14px;

    border: none;
    border-radius: 8px;

    background: #20d6a3;
    color: #061019;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.links {
    text-align: center;
    margin-top: 20px;
}

.links a {
    color: #20d6a3;
    text-decoration: none;
}

.demo {
    text-align: center;
    margin-top: 20px;

    font-size: 12px;
    color: #8fa0b1;
    line-height: 1.5;
}
</style>

</head>

<body>

<div class="container">

    <div class="logo">
        YvesFX
    </div>

    <div class="card">

        <h1>Login</h1>

        <p class="subtitle">
            Access your demo trading account.
        </p>

        <form id="loginForm">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login to Demo
            </button>

        </form>

        <div class="links">
            <a href="register.html">
                Create Demo Account
            </a>
            &nbsp; · &nbsp;
            <a href="index.html">
                Home
            </a>
        </div>

        <div class="demo">
            DEMO ONLY — No real money, brokerage execution,
            or client funds are connected.
        </div>

    </div>

</div>


<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("password")
        .value;

    /*
       Get the demo account saved by register.html
    */

    const savedUser =
        JSON.parse(
            localStorage.getItem("yvesfxUser") || "null"
        );


    /*
       Check account
    */

    if (!savedUser) {

        alert(
            "No demo account found. Please create a demo account first."
        );

        window.location.href = "register.html";

        return;
    }


    /*
       Check email and password
    */

    if (
        savedUser.email !== email ||
        savedUser.password !== password
    ) {

        alert(
            "Incorrect email or password."
        );

        return;
    }


    /*
       Login successful
    */

    localStorage.setItem(
        "yvesfxSession",
        savedUser.email
    );


    alert(
        "Login successful! Welcome to YvesFX."
    );


    /*
       Go to trading dashboard
    */

    window.location.href =
        "dashboard.html";

});

</script>

</body>
</html>
