<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YvesFX | Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050b12;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #0b141d;
      border: 1px solid #173040;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #18d6a3;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8ea0ad;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      color: #dbe4ea;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #203746;
      background: #050b12;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #18d6a3;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #18d6a3;
      color: #03100c;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #12bd90;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      color: #8ea0ad;
    }

    .links a {
      color: #18d6a3;
      text-decoration: none;
      font-weight: bold;
    }

    .demo {
      margin-top: 22px;
      padding: 12px;
      border-radius: 10px;
      background: #111f2a;
      color: #9fb0bb;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">YvesFX</div>

    <div class="subtitle">
      Create your Demo Trading Account
    </div>

    <form id="registerForm">

      <label>Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label>Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <label>Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
      >

      <button type="submit">
        Create Demo Account
      </button>

    </form>

    <div class="links">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <div class="links">
      <a href="index.html">← Back to Home</a>
    </div>

    <div class="demo">
      ⚠️ DEMO PLATFORM<br>
      This account uses virtual money only.
      No real money is deposited or traded.
    </div>

  </div>


<script>

document.getElementById("registerForm").addEventListener("submit", function(e) {

  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert("Passwords do not match!");
    return;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters.");
    return;
  }

  // Create demo user
  const user = {
    name: name,
    email: email,
    password: password,

    // Starting virtual balance
    balance: 10000,
    equity: 10000,

    positions: [],
    history: [],

    createdAt: new Date().toISOString()
  };

  // Save demo account
  localStorage.setItem("yvesfxUser", JSON.stringify(user));

  // Create login session
  localStorage.setItem("yvesfxSession", "true");

  alert(
    "Welcome to YvesFX!\\n\\n" +
    "Your demo account has been created successfully.\\n\\n" +
    "Starting Balance: $10,000"
  );

  // Go directly to dashboard
  window.location.href = "dashboard.html";

});

</script>

</body>
</html>
