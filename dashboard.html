<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YvesFX | Demo Trading</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:#eef6ff;
}

button,input,select{
    font:inherit;
}

.top{
    position:sticky;
    top:0;
    z-index:5;
    background:#0a1727;
    border-bottom:1px solid #1d3147;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:#20d6a3;
    font-size:23px;
    font-weight:800;
}

.top-right{
    display:flex;
    gap:10px;
    align-items:center;
}

.logout{
    background:#17283b;
    color:#fff;
    border:1px solid #2a4058;
    padding:9px 12px;
    border-radius:8px;
}

.wrap{
    max-width:1250px;
    margin:auto;
    padding:18px;
}

.demo-banner{
    background:#10273a;
    border:1px solid #27506c;
    color:#a9c5d8;
    padding:11px 14px;
    border-radius:10px;
    margin-bottom:16px;
    font-size:13px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.stat{
    background:#0d1c2d;
    border:1px solid #1d3147;
    border-radius:12px;
    padding:16px;
}

.label{
    color:#8fa3b7;
    font-size:12px;
}

.value{
    font-size:23px;
    font-weight:700;
    margin-top:5px;
}

.grid{
    display:grid;
    grid-template-columns:1.5fr .9fr;
    gap:15px;
    margin-top:15px;
}

.panel{
    background:#0d1c2d;
    border:1px solid #1d3147;
    border-radius:12px;
    padding:16px;
}

.panel h2{
    font-size:16px;
    margin:0 0 13px;
}

.market{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.market button{
    background:#10263a;
    color:#cfe0ef;
    border:1px solid #29455e;
    border-radius:8px;
    padding:8px 11px;
}

.market button.active{
    border-color:#20d6a3;
    color:#20d6a3;
}

.price{
    font-size:31px;
    font-weight:700;
}

.up{
    color:#20d6a3;
}

.down{
    color:#ff6b7a;
}

.chart{
    height:260px;
    background:#081522;
    border:1px solid #172b3f;
    border-radius:10px;
    position:relative;
    overflow:hidden;
}

.chart canvas{
    width:100%;
    height:100%;
}

.trade-form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.trade-form label{
    font-size:12px;
    color:#91a6ba;
}

.trade-form input,
.trade-form select{
    width:100%;
    padding:11px;
    border-radius:7px;
    border:1px solid #294057;
    background:#07111f;
    color:#fff;
}

.full{
    grid-column:1/-1;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.buy,
.sell{
    padding:13px;
    border:0;
    border-radius:8px;
    font-weight:800;
}

.buy{
    background:#20d6a3;
    color:#061019;
}

.sell{
    background:#ff586c;
    color:#fff;
}

.table-wrap{
    overflow:auto;
}

.table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

.table th,
.table td{
    padding:10px;
    border-bottom:1px solid #1c3045;
    text-align:left;
    white-space:nowrap;
}

.muted{
    color:#8fa3b7;
}

.close{
    background:#17283b;
    color:#fff;
    border:1px solid #31475d;
    padding:6px 9px;
    border-radius:6px;
}

.section{
    margin-top:15px;
}

.empty{
    text-align:center;
    color:#8195aa;
    padding:18px;
}

.positive{
    color:#20d6a3;
}

.negative{
    color:#ff6b7a;
}

@media(max-width:850px){
    .stats{
        grid-template-columns:1fr 1fr;
    }

    .grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){
    .wrap{
        padding:10px;
    }

    .stat{
        padding:12px;
    }

    .value{
        font-size:18px;
    }

    .price{
        font-size:25px;
    }
}
</style>
</head>

            <div class="label">OPEN P/L</div>
            <div class="value" id="pnl">
                $0.00
            </div>
        </div>

    </div>

    <div class="grid">
